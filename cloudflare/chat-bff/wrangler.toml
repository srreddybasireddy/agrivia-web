name = "agrivia-chat-bff"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
ORIGIN_API_BASE = "https://api.agrivia.ai/api"
SITE_ORIGIN = "http://agrivia.ai.s3-website-us-west-2.amazonaws.com"

# Apex HTML + /api BFF. www 301s to https://agrivia.ai. Do not orange-cloud api.agrivia.ai.
[[routes]]
pattern = "agrivia.ai/*"
zone_name = "agrivia.ai"

[[routes]]
pattern = "www.agrivia.ai/*"
zone_name = "agrivia.ai"

# Community feed: KV for post JSON, R2 for photo/video bytes.
# Binding names must match env.COMMUNITY and env.COMMUNITY_MEDIA in community.js.
[[kv_namespaces]]
binding = "COMMUNITY"
id = "114780c5bedf49319f2c4db82cd8ce6d"
[[r2_buckets]]
binding = "COMMUNITY_MEDIA"
bucket_name = "agrivia-community-media"
