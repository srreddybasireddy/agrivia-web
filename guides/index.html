    <header class="site-header">

                    <div id="authSignedIn" hidden>
                        <span class="auth-email" id="authEmailLabel"></span>
                        <button type="button" class="btn btn-outline btn-sm" id="authSignOut">Sign out</button>

            </div>
        </div>

    <main class="section-padding">
        <div class="container">
            <div class="guides-hero">
                <div>
                    <h1 class="guides-hero-title">Guides</h1>
                    <p class="guides-hero-desc" id="guidesTabHelper">How-to documents from Agrivia and other growers.</p>
                </div>
                <div class="guides-hero-actions">
                    <a href="write.html" class="btn btn-outline" id="guidesWriteBtn">Write a guide</a>

            </div>

                <button type="submit" class="btn btn-primary">Search</button>
            </form>
            <div class="guide-tabs" id="guidesTabs" role="tablist" aria-label="Guide type">
                <button type="button" class="guide-tab" data-tab="documents" aria-pressed="true">Documents</button>
                <button type="button" class="guide-tab" data-tab="videos" aria-pressed="false">Videos</button>
            </div>
            <div class="guide-tabs guide-subtabs" id="guidesOutcomeTabs" role="tablist" aria-label="Video outcome" hidden>
                <button type="button" class="guide-tab" data-outcome="" aria-pressed="true">All videos</button>
                <button type="button" class="guide-tab" data-outcome="success" aria-pressed="false">Success</button>
                <button type="button" class="guide-tab" data-outcome="experience" aria-pressed="false">Experiences</button>
            </div>
            <p class="farm-status" id="guidesStatus" hidden>Loading guides…</p>
            <article class="featured-guide paper-card" id="guidesFeatured" hidden></article>
            <div class="blog-grid guide-card-grid" id="guidesGrid"></div>
            <div class="guide-empty-actions" id="guidesEmptyActions" hidden></div>
